name: CI

# 本机（Windows）无法运行 `go test -race`（缺 gcc/CGO），因此竞态检测必须在 CI 完成。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'
  CGO_ENABLED: 0

jobs:
  backend:
    name: 后端（vet / race / cover / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 格式检查
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 竞态检测（本机不可用，CI 必跑）
        run: go test -race ./...

      - name: 覆盖率
        run: go test -coverpkg=./... -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1

      - name: 构建（静态二进制）
        run: go build -trimpath -ldflags "-s -w" -o bin/metalwatch ./cmd/server

      - name: Agent 模块（独立 module）：vet + 三平台交叉编译
        working-directory: agent
        run: |
          go vet ./...
          mkdir -p bin
          for t in linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "bin/metalwatch-agent-$os-$arch$ext" "./cmd/$os"
          done

  frontend:
    name: 前端（Node 22 / 24 双版本）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      matrix:
        node: ['22.22', '24.21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  fpk:
    name: FPK 骨架校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验骨架（强制文件 / JSON / LF 换行 / 端口一致 / native 形态断言）
        run: python deploy/tools/check_fpk.py
