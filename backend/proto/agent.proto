syntax = "proto3";

package metalwatch.agent;

import "mesh.proto";
import "bmc.proto";

option go_package = "gitee.com/zhangyilin_233/metalwatch/proto/gen;mwpb";

// MetalWatch Agent ↔ 服务端通信契约（gRPC 双向流 + Protobuf + TLS）
//
// 传输约定（详见 docs/04 §2）：
//   Stream: 长连接双向流 —— 上行指标/资产/心跳/链路探测，下行控制指令/配置热更新/路由表
//   Enroll: 一次性 unary —— 注册码换取长期令牌
//
// 演进规则：字段只增不删、编号永不复用；删除字段用 reserved 标记。

// SensorMetric 是一条硬件传感器采样。
// 标签只保留低基数字段（device），SN、时间戳等高基数信息不得作为时序标签，
// 否则会打爆时序索引（见 docs/03 数据设计 §3）。
message SensorMetric {
  string name = 1;    // cpu_temp_celsius / fan_rpm / voltage_volts / power_watts ...
  string device = 2;  // cpu0 / fan1 / psu0 / disk_sda
  double value = 3;
  string unit = 4;    // celsius / rpm / volts / watts
  int32 status = 5;   // 0=ok 1=warning 2=critical 3=unknown
}

// DiskSmart 是磁盘 SMART 健康信息。
message DiskSmart {
  string device = 1;      // sda / nvme0n1
  string model = 2;
  string sn = 3;          // 仅用于资产识别，不作为时序标签
  double temp_celsius = 4;
  int32 reallocated_sector = 5;
  double wear_level = 6;  // SSD 磨损百分比
  bool health = 7;
  int32 power_on_hours = 8;
}

message CpuInfo {
  string model = 1;
  int32 cores = 2;
  int32 threads = 3;
  string socket = 4;
  double base_mhz = 5;
}

message MemInfo {
  string slot = 1;
  string manufacturer = 2;
  string part_number = 3;
  uint64 size_bytes = 4;
  string speed = 5;
  string type = 6;
}

message NicInfo {
  string name = 1;
  string mac = 2;
  string driver = 3;
  int32 speed_mbps = 4;
  string link_state = 5;
}

message RaidInfo {
  string controller = 1;
  string level = 2;
  int32 state = 3;         // 0=optimal 1=degraded 2=failed
  int32 rebuild_percent = 4;
  int32 disk_count = 5;
}

// AssetSnapshot 是硬件资产快照，用于变更检测（docs/02 M4）。
message AssetSnapshot {
  string fingerprint = 1;    // 快照指纹：内容哈希，指纹变化才触发 diff
  string sn = 2;
  string board_model = 3;
  string bios_version = 4;
  CpuInfo cpu = 5;
  repeated MemInfo memory = 6;
  repeated NicInfo nic = 7;
  RaidInfo raid = 8;
  string collected_at = 9;   // RFC3339 UTC
}

// AgentLog 是 Agent 侧运行日志（默认只回传 warning 以上）。
message AgentLog {
  string level = 1;
  string message = 2;
  int64 at = 3;        // Unix 毫秒
  string source = 4;   // collector / grpc / mesh / bmc
}

// AgentReport 是 Agent 上行消息。一条流承载多种 kind，避免为每类数据各开一条连接。
message AgentReport {
  metalwatch.mesh.MeshHeader mesh = 1;
  int64 timestamp = 2;                  // Unix 毫秒：采集时刻
  string kind = 3;                      // metrics / asset / heartbeat / event / link_probe
  repeated SensorMetric sensors = 4;
  repeated DiskSmart disks = 5;
  AssetSnapshot asset = 6;
  repeated AgentLog logs = 7;
  repeated metalwatch.mesh.LinkProbe link_probes = 8;
  repeated metalwatch.bmc.BmcResult bmc_results = 9;
  string batch_id = 10;                 // 幂等键：断网续传重放时服务端据此去重
}

// AgentConfig 由服务端下发，Agent 热加载生效，无需重启。
message AgentConfig {
  int64 version = 1;
  int32 sensor_interval_sec = 2;
  int32 asset_interval_sec = 3;
  bool ipmi_enabled = 4;
  bool mesh_enabled = 5;
  uint32 mesh_max_hops = 6;
  bool relay_enabled = 7;      // 本节点是否允许作为中继
  uint32 spool_max_hours = 8;  // 断网缓存保留时长，超时丢弃
  int32 log_level = 9;         // 0=debug 1=info 2=warn 3=error
}

// ServerCommand 是服务端下行消息：控制指令、配置热更新、路由表下发。
message ServerCommand {
  string command_id = 1;
  metalwatch.bmc.BmcCommand bmc_cmd = 2;
  AgentConfig config = 3;
  metalwatch.mesh.RouteTable route_table = 4;
  bool request_asset = 5;   // 立即触发一次全量资产采集
  string server_time = 6;   // RFC3339 UTC，供 Agent 校正时间偏差
}

// EnrollRequest 是首次注册请求（一次性注册码换取长期令牌）。
message EnrollRequest {
  string enroll_code = 1;
  string hostname = 2;
  string primary_ip = 3;
  string smbios_uuid = 4;
  string os_type = 5;
  string os_version = 6;
  string agent_version = 7;
  metalwatch.bmc.BmcCapability bmc_capability = 8;
}

// EnrollResponse 返回长期令牌。令牌明文只出现这一次。
message EnrollResponse {
  int64 host_id = 1;
  string agent_id = 2;
  string agent_token = 3;
  int32 report_interval_sec = 4;
  int32 asset_interval_sec = 5;
  string server_time = 6;
}

// AgentStreamService 是 Agent 与服务端之间的双向流通道。
//
// Stream 长连接承载上报与指令下发（秒级实时、无轮询延迟）；
// Enroll 为一次性 unary 调用——注册本身不需要长连接，也不需要保活。
service AgentStreamService {
  rpc Stream(stream AgentReport) returns (stream ServerCommand);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}
