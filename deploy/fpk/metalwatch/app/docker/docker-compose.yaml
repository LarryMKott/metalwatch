# MetalWatch FPK 应用编排
# 由飞牛 fnOS 依据 config/resource 的 docker-project 声明负责 up/down。
# 端口、目录一律使用飞牛注入的环境变量，禁止硬编码路径。
name: metalwatch

services:
  db:
    image: mysql:8.4
    container_name: metalwatch-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${wizard_db_password}
      MYSQL_DATABASE: metalwatch
      MYSQL_USER: metalwatch
      MYSQL_PASSWORD: ${wizard_db_password}
      TZ: ${wizard_timezone}
    volumes:
      - ${TRIM_PKGVAR}/mysql:/var/lib/mysql
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${wizard_db_password}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  tsdb:
    image: prom/prometheus:v3.1.0
    container_name: metalwatch-tsdb
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${wizard_metric_retention_days}d
      - --web.enable-lifecycle
    volumes:
      - ${TRIM_APPDEST}/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${TRIM_PKGVAR}/prometheus:/prometheus
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ghcr.io/metalwatch/metalwatch-server:0.1.0
    container_name: metalwatch-api
    restart: unless-stopped
    # 与 TSDB 同理：直接以应用用户身份运行，避免宿主目录权限问题
    user: "${TRIM_UID}:${TRIM_GID}"
    depends_on:
      db:
        condition: service_healthy
      tsdb:
        condition: service_started
    environment:
      METALWATCH_DB_DSN: metalwatch:${wizard_db_password}@tcp(db:3306)/metalwatch?charset=utf8mb4&parseTime=true
      METALWATCH_PROM_URL: http://tsdb:9090
      METALWATCH_DATA_DIR: /data
      METALWATCH_LISTEN: ":8080"
      METALWATCH_IPMI_CONCURRENCY: ${wizard_ipmi_concurrency:-16}
      METALWATCH_SENSOR_INTERVAL: ${wizard_sensor_interval:-30}
      METALWATCH_ALERT_WEBHOOK: ${wizard_alert_webhook:-}
      METALWATCH_LOG_LEVEL: ${wizard_log_level:-info}
      METALWATCH_SECRET_DIR: /data/secret
      TZ: ${wizard_timezone:-Asia/Shanghai}
    # 单端口对外：容器 8080 映射到 manifest.service_port，Agent 上报与 WebUI 共用该端口
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    volumes:
      - ${TRIM_PKGVAR}/data:/data
      - ${TRIM_DATA_SHARE_PATHS}:/shares
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
