global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # MetalWatch 服务端内置 exporter：IPMI 带外采集与 Agent 上报的指标统一由此暴露
  - job_name: metalwatch
    scheme: http
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8080"]

  # Prometheus 自身可观测性（FPK 自身健康）
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
